rss_feed: "URL of the RSS Feed"
nostr_private_key: "Your Private Key in Hex Format"
nostr_public_key: "Your Public Key in Hex Format"

# The event is signed once and sent to every relay in parallel. An item is only
# marked as posted when at least one relay accepts it, so a relay being down or
# rate-limiting leaves the item to be retried on the next cycle.
relay_urls:
  - "wss://relay.damus.io"
  - "wss://nos.lol"

fetch_interval_minutes: 5
cache_file: "posted_articles.json"

# Go text/template. Available fields: .Title .Image .Link (.Thumb is an alias
# for .Image, kept for older configs). Wrap .Image in `with` so items without a
# picture do not leave a blank line. Must be double-quoted for \n to be a newline.
message_format: "{{ .Title }}\n{{ with .Image }}{{ . }}\n{{ end }}{{ .Link }}"

# Cache pruning. Retention only has to outlast the window the feed itself
# covers: once an item drops off the feed it can never be seen again, so
# forgetting it cannot cause a repost. Set either to 0 to disable that rule.
cache_retention_days: 30
cache_max_entries: 5000

# Deprecated, still honoured. A single relay, merged into relay_urls above.
# relay_url: "wss://relay.example.com"
